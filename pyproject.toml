[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-failure"
version = "0.1.0"
description = "Scania APS failure prediction with an XGBoost pipeline and FastAPI inference service."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.10,<3",
    "scikit-learn==1.7.2",
    "xgboost==3.1.0",
    "pandas>=2.2,<3",
    "joblib>=1.4,<2",
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
